[package]
name = "raytracer"
version = "0.9.0"
authors = ["Megan Pycroft <megan.pycroft@gmail.com>"]
edition = "2021"
description = "A ray tracer written in Rust"
repository = "https://github.com/mpycroft/raytracer"
license = "MIT"

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.23", features = ["derive"] }
console = "0.15.8"
derive-new = "0.7.0"
derive_more = { version = "1.0.0", features = ["full"] }
either = "1.13.0"
enum-map = "2.7.3"
enum_dispatch = "0.3.13"
exmex = "0.20.3"
float-cmp = "0.10.0"
image = "0.25.5"
indicatif = { version = "0.17.9", features = ["rayon"] }
libnoise = "1.1.2"
paste = "1.0.15"
rand = "0.8.5"
rand_xoshiro = "0.6.0"
rayon = "1.10.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_yaml = "0.9.34"
typed-builder = "0.20.0"

[lints.clippy]
pedantic = "warn"
